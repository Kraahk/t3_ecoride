
services:
  app:
    build:
      context: .
      dockerfile: DockerFile.dev
    environment:
      NODE_ENV: development
      SKIP_ENV_VALIDATION: 1
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules 
    ports:
      - "3000:3000"
  prisma-studio:
    image: node:20-alpine
    container_name: eco_prisma_studio
    working_dir: /app
    command: sh -c "npx prisma studio --port 5555"
    ports:
      - "5555:5555"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ecoride

